name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test va build
        run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/university-*.jar
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: SSH kalitini sozlash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Serverga yuklash va qayta ishga tushirish
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          TARGET="$SSH_USER@$SSH_HOST"
          scp -i ~/.ssh/id_deploy deploy/deploy.sh "$TARGET:/opt/back/deploy.sh"
          scp -i ~/.ssh/id_deploy dist/university-*.jar "$TARGET:/opt/back/app.jar.new"
          ssh -i ~/.ssh/id_deploy "$TARGET" 'chmod +x /opt/back/deploy.sh && /opt/back/deploy.sh'
