name: CI/CD — Build & Deploy (JAR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────── 1. Test ─────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: davro_electro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/davro_electro
          DB_USER: postgres
          DB_PASSWORD: root123
        run: mvn verify -B

  # ───────────────────────── 2. Build & Deploy ─────────────────────────
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Build JAR
        run: mvn package -DskipTests -B

      - name: 📤 JAR ni serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "target/*.jar"
          target: "/opt/davron-elektro/"
          strip_components: 1

      - name: 🚀 Ilovani qayta ishga tushirish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Eski jarayonni to'xtatish
            sudo systemctl restart davron-elektro || {
              echo "Systemd service topilmadi, qo'lda ishga tushirilmoqda..."
              pkill -f "davron-elektro" || true
              sleep 2
              cd /opt/davron-elektro
              nohup java -jar -Dspring.profiles.active=prod *.jar > app.log 2>&1 &
              sleep 5
              echo "✅ Ilova ishga tushdi (PID: $(pgrep -f davron-elektro))"
            }
