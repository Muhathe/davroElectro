spring.application.name=university
server.port=8082

# Ma'lumotlar bazasi (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/davro_electro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tashkent

# JSON
spring.jackson.time-zone=Asia/Tashkent
spring.jackson.default-property-inclusion=non_null

# JWT
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-secret-key-at-least-32-chars}
app.jwt.expiration-ms=86400000

# CORS (React uchun)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Fayl yuklash (Excel import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Fayllar (tovar rasmlari). Serverda doimiy papka: FILES_DIR=/var/davron/files
app.files.dir=${FILES_DIR:./files}

# Chekdagi do'kon nomi (PUT /api/settings/store saqlanmaguncha)
app.store.name=Davron Elektro

# Fiskal chek: FiscalProvider ulangandan keyin FISCAL_ENABLED=true
app.fiscal.enabled=${FISCAL_ENABLED:false}
app.fiscal.max-attempts=20
app.fiscal.retry-delay-ms=60000

# Chek printeri: har bir kassa kompyuteriga saytdan (/api/print/terminals) o'z tokenli agent o'rnatiladi.
# Eski umumiy agent tokeni (ixtiyoriy, faqat kassasi ko'rsatilmagan cheklarni oladi)
app.print.agent-token=${PRINT_AGENT_TOKEN:}
# Sotuv/vozvratdan keyin chek avtomatik navbatga qo'yiladi
app.print.auto=${PRINT_AUTO:true}
# 58 mm = 32 belgi, 80 mm = 48 belgi
app.print.width=${PRINT_WIDTH:32}
# Pichog'i bor printerda true (XP-58IIL da pichoq yo'q)
app.print.cut=${PRINT_CUT:false}
# Agent o'chiq paytda yig'ilgan cheklar shuncha daqiqadan keyin chop etilmaydi
app.print.max-age-minutes=15
# O'rnatish faylidagi server manzili (bo'sh bo'lsa so'rov kelgan manzil, masalan http://89.116.30.180:8082)
app.print.public-url=${PRINT_PUBLIC_URL:}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
#bilish
# Kassa: manfiy qoldiqqa ruxsat (false = harajat/to'lov kassa yetmasa rad etiladi)
app.cash.allow-negative=false

# Boshlang'ich ma'lumot (rollar matritsasi, kategoriyalar, hisob rejasi, demo tovar va mijozlar)
app.seed.enabled=true
app.seed.demo-data=true
app.seed.default-password=${SEED_PASSWORD:admin123}
app.seed.opening-cash=12000000

# AI yordamchi (kalit faqat serverda, frontendga chiqmaydi). OpenAI mos API: standart — Groq bepul tarifi
app.ai.api-key=${AI_API_KEY:gsk_j9748oMcvN8pdsyFJs2uWGdyb3FYjfP7hbASly2n4F1tfYAUomNfgsk_j9748oMcvN8pdsyFJs2uWGdyb3FYjfP7hbASly2n4F1tfYAUomNf}
app.ai.model=${AI_MODEL:openai/gpt-oss-120b}
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}

# Loglar
logging.level.univer.university=INFO
